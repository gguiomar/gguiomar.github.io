server {
    listen 80;
    server_name gguiomar.org www.gguiomar.org;
    return 301 https://gguiomar.org$request_uri;
}
server {
    listen 443 ssl;
    server_name www.gguiomar.org;
    ssl_certificate /etc/ssl/gguiomar/origin.pem;
    ssl_certificate_key /etc/ssl/gguiomar/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://gguiomar.org$request_uri;
}
server {
    listen 443 ssl;
    server_name gguiomar.org;
    ssl_certificate /etc/ssl/gguiomar/origin.pem;
    ssl_certificate_key /etc/ssl/gguiomar/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/gguiomar/current;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
